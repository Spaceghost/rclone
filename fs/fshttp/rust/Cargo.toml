[package]
name = "rclone-http"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Experimental streaming HTTP transport for rclone"

[lib]
name = "rclone_http"
crate-type = ["staticlib", "rlib"]

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "native-tokio", "ring", "tls12"] }
hyper-timeout = "0.5"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
