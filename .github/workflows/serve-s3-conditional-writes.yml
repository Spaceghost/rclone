name: serve s3 conditional write validation

on:
  push:
    branches:
      - ci/serve-s3-conditional-writes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    if: github.repository == 'Spaceghost/rclone'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout S3 protocol library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: rclone/gofakes3
          ref: v0.0.9
          persist-credentials: false
      - name: Archive source
        run: |
          git archive --format=tar.gz -o /tmp/gofakes3.tar.gz HEAD
          git rev-parse HEAD
      - name: Upload source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gofakes3-source
          path: /tmp/gofakes3.tar.gz
          retention-days: 7
