name: serve s3 conditional write validation

on:
  push:
    branches:
      - ci/serve-s3-conditional-writes
    paths:
      - .github/workflows/serve-s3-conditional-writes.yml
      - gofakes3-conditional-writes.patch
      - gofakes3-conditional-fixes.patch
      - gofakes3-conditional-aws-semantics.patch
      - rclone-existing-files.patch
      - rclone-cas-compile-fix.patch
      - rclone-xfs-atomic-commit.patch
      - rclone-cas-atomic-fixes.patch
      - rclone-xfs-integration-test.patch
      - rclone-files/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    if: github.repository == 'Spaceghost/rclone'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed patches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: patches
          persist-credentials: false
      - name: Checkout S3 protocol library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: rclone/gofakes3
          ref: v0.0.9
          path: protocol
          persist-credentials: false
      - name: Apply protocol change
        working-directory: protocol
        run: |
          set -euo pipefail
          git apply --check ../patches/gofakes3-conditional-writes.patch
          git apply ../patches/gofakes3-conditional-writes.patch
          git apply --check ../patches/gofakes3-conditional-fixes.patch
          git apply ../patches/gofakes3-conditional-fixes.patch
          git apply --recount --check ../patches/gofakes3-conditional-aws-semantics.patch
          git apply --recount ../patches/gofakes3-conditional-aws-semantics.patch
          git diff --check
          test -z "$(gofmt -l conditional.go conditional_test.go error.go gofakes3.go)"
          ! git diff --unified=0 | grep '^+' | grep -E 'TODO|FIXME'
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: protocol/go.sum
      - name: Test protocol library
        working-directory: protocol
        run: |
          set -o pipefail
          mkdir -p /tmp/cas-results
          go test -race -count=1 ./... 2>&1 | tee /tmp/cas-results/protocol-race.txt
      - name: Checkout upstream base for prerequisite branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 73119d368f26d62059c0158ee25f0208e12d142a
          path: publish
          persist-credentials: false
      - name: Publish isolated prerequisite module
        working-directory: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git checkout -b deps/serve-s3-conditional-writes
          mkdir gofakes3
          tar -C ../protocol --exclude=./.git -cf - . | tar -C gofakes3 -xf -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gofakes3
          git commit -m 'gofakes3: support conditional object writes' -m 'Based on rclone/gofakes3 v0.0.9. Isolated prerequisite module for serve s3 conditional writes; the rclone feature branch does not vendor this source.'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --force origin HEAD:refs/heads/deps/serve-s3-conditional-writes
          git rev-parse HEAD | tee /tmp/cas-results/protocol-revision.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protocol-results
          path: /tmp/cas-results/*.txt
          retention-days: 14

  rclone:
    if: github.repository == 'Spaceghost/rclone'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RCLONE_CONFIG: /notfound
    steps:
      - name: Checkout reviewed patches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: patches
          persist-credentials: false
      - name: Checkout upstream rclone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: rclone/rclone
          ref: 73119d368f26d62059c0158ee25f0208e12d142a
          path: work
          persist-credentials: false
      - name: Checkout protocol library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: rclone/gofakes3
          ref: v0.0.9
          path: protocol
          persist-credentials: false
      - name: Apply protocol patch
        working-directory: protocol
        run: |
          set -euo pipefail
          git apply ../patches/gofakes3-conditional-writes.patch
          git apply ../patches/gofakes3-conditional-fixes.patch
          git apply --recount ../patches/gofakes3-conditional-aws-semantics.patch
      - name: Apply rclone patches
        working-directory: work
        run: |
          set -euo pipefail
          git apply --recount --check ../patches/rclone-existing-files.patch
          git apply --recount ../patches/rclone-existing-files.patch
          cp -a ../patches/rclone-files/. .
          git apply --recount --check ../patches/rclone-cas-compile-fix.patch
          git apply --recount ../patches/rclone-cas-compile-fix.patch
          git apply --recount --check ../patches/rclone-xfs-atomic-commit.patch
          git apply --recount ../patches/rclone-xfs-atomic-commit.patch
          git apply --recount --check ../patches/rclone-cas-atomic-fixes.patch
          git apply --recount ../patches/rclone-cas-atomic-fixes.patch
          git apply --recount --check ../patches/rclone-xfs-integration-test.patch
          git apply --recount ../patches/rclone-xfs-integration-test.patch
          git diff --check
          test -z "$(gofmt -l cmd/serve/s3 backend/local fs/atomic_commit.go)"
          ! git diff --unified=0 | grep '^+' | grep -E 'TODO|FIXME'
          go mod edit -replace github.com/rclone/gofakes3=../protocol
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: work/go.sum
      - name: Test conditional writes and local backend
        working-directory: work
        run: |
          set -o pipefail
          mkdir -p /tmp/cas-results
          go test -race -count=1 -skip '^TestS3Minio$' ./cmd/serve/s3 ./backend/local ./fs 2>&1 | tee /tmp/cas-results/rclone-race.txt
          go build ./... 2>&1 | tee /tmp/cas-results/rclone-build.txt
      - name: Mount XFS test filesystem
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs
          truncate -s 512M /tmp/rclone-xfs.img
          sudo mkfs.xfs -f /tmp/rclone-xfs.img
          sudo mkdir -p /mnt/rclone-xfs
          sudo mount -o loop /tmp/rclone-xfs.img /mnt/rclone-xfs
          sudo chown "$USER" /mnt/rclone-xfs
          findmnt -no FSTYPE /mnt/rclone-xfs | grep -x xfs
      - name: Exercise XFS commit ioctls
        working-directory: work
        env:
          RCLONE_TEST_XFS_DIR: /mnt/rclone-xfs
        run: |
          set -o pipefail
          go test -v -count=1 -run '^TestXFSAtomicCommit$' ./backend/local 2>&1 | tee /tmp/cas-results/xfs-integration.txt
      - name: Unmount XFS test filesystem
        if: always()
        run: sudo umount /mnt/rclone-xfs || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rclone-results
          path: /tmp/cas-results/*.txt
          retention-days: 14
