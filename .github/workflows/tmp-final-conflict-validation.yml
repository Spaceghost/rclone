name: final conflict stack validation

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-final-conflict-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: onedrive-etag-preconditions
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check stack and formatting
        run: |
          test "$(git rev-list --count origin/master..HEAD)" -eq 3
          test -z "$(git diff --name-only origin/master...HEAD -- .github)"
          test -z "$(gofmt -l fs/fs.go vfs/vfscache/writeback/writeback.go vfs/vfscache/writeback/writeback_test.go vfs/vfscache/item.go vfs/vfscache/conflict_state_test.go vfs/vfscache/conflict.go vfs/vfscache/conflict_test.go vfs/rc_conflict.go vfs/rc_conflict_test.go backend/onedrive/onedrive.go backend/onedrive/onedrive_test.go)"
          git diff --check origin/master...HEAD
          bin/check_autogenerated_edits.py origin/master
      - name: Test changed packages
        env:
          RCLONE_CONFIG: /notfound
        run: go test ./fs ./vfs/vfscache/writeback ./vfs/vfscache ./vfs ./backend/onedrive
      - name: Race test VFS
        env:
          RCLONE_CONFIG: /notfound
        run: go test -race ./vfs/vfscache/... ./vfs
      - name: Vet changed packages
        run: go vet ./fs ./vfs/vfscache/writeback ./vfs/vfscache ./vfs ./backend/onedrive
      - name: Build
        run: go build
      - name: Quick test
        env:
          RCLONE_CONFIG: /notfound
        run: make quicktest
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          skip-cache: true
