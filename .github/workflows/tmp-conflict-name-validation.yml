name: temporary conflict filename validation

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-conflict-name-validation.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "~1.27.0"
          check-latest: true
          cache: false

      - name: Install test dependencies
        run: |
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
          sudo chown root:$USER /etc/fuse.conf
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse-dev rpm pkg-config git-annex git-annex-remote-rclone nfs-common
          sudo rm -f /usr/local/bin/fusermount /usr/local/bin/fusermount3

      - name: Prove and fix conflict filename handling
        env:
          GOTOOLCHAIN: local
          RCLONE_CONFIG: /notfound
        run: |
          set -euxo pipefail

          git config user.name Spaceghost
          git config user.email 251370+Spaceghost@users.noreply.github.com
          git fetch origin vfs-object-changed vfs-conflict-resolution onedrive-etag-preconditions

          core_head=$(git rev-parse origin/vfs-object-changed)
          old_resolution=$(git rev-parse origin/vfs-conflict-resolution)
          old_onedrive=$(git rev-parse origin/onedrive-etag-preconditions)

          git checkout -B vfs-conflict-resolution origin/vfs-conflict-resolution
          python3 - <<'PY'
          from pathlib import Path

          p = Path("vfs/vfscache/conflict_test.go")
          s = p.read_text()
          old = '''\tassert.Equal(t, ".profile-workstation", conflictName(".profile", "workstation", 1))
          '''
          new = old + '''\tassert.Equal(t, "file-work-station.txt", conflictName("file.txt", "work/station", 1))
          '''
          if s.count(old) != 1:
              raise SystemExit(f"expected one conflict filename assertion, found {s.count(old)}")
          p.write_text(s.replace(old, new))
          PY
          gofmt -w vfs/vfscache/conflict_test.go

          if go test ./vfs/vfscache -run '^TestConflictName$'; then
            echo "hostname separator regression test unexpectedly passed before the fix" >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path("vfs/vfscache/conflict.go")
          s = p.read_text()
          old = '''func conflictName(name, hostname string, n int) string {
          \tdir, leaf := path.Split(name)
          '''
          new = '''func conflictName(name, hostname string, n int) string {
          \thostname = strings.ReplaceAll(hostname, "/", "-")
          \tdir, leaf := path.Split(name)
          '''
          if s.count(old) != 1:
              raise SystemExit(f"expected one conflictName insertion point, found {s.count(old)}")
          p.write_text(s.replace(old, new))
          PY
          gofmt -w vfs/vfscache/conflict.go vfs/vfscache/conflict_test.go
          go test ./vfs/vfscache -run '^TestConflictName$'

          git add vfs/vfscache/conflict.go vfs/vfscache/conflict_test.go
          git commit --amend --no-edit
          resolution_head=$(git rev-parse HEAD)
          test "$(git rev-parse "$resolution_head^")" = "$core_head"
          test "$(git rev-list --count "$core_head..$resolution_head")" -eq 1

          git checkout -B onedrive-etag-preconditions origin/onedrive-etag-preconditions
          git rebase --onto "$resolution_head" "$old_resolution" onedrive-etag-preconditions
          onedrive_head=$(git rev-parse HEAD)
          test "$(git rev-parse "$onedrive_head^")" = "$resolution_head"
          test "$(git rev-list --count "$resolution_head..$onedrive_head")" -eq 1

          base=$(git merge-base "$core_head" "$core_head^")
          test -z "$(gofmt -l fs/fs.go vfs/vfscache/writeback/writeback.go vfs/vfscache/writeback/writeback_test.go vfs/vfscache/item.go vfs/vfscache/conflict_state_test.go vfs/vfscache/conflict.go vfs/vfscache/conflict_test.go vfs/rc_conflict.go vfs/rc_conflict_test.go backend/onedrive/onedrive.go backend/onedrive/onedrive_test.go)"
          git diff --check "$base"
          bin/check_autogenerated_edits.py "$base"
          go test ./fs ./vfs/vfscache/writeback ./vfs/vfscache ./vfs ./backend/onedrive
          go test -race ./vfs/vfscache/... ./vfs
          go vet ./fs ./vfs/vfscache/writeback ./vfs/vfscache ./vfs ./backend/onedrive
          go build
          make
          make quicktest

          echo "RESOLUTION_HEAD=$resolution_head" >> "$GITHUB_ENV"
          echo "ONEDRIVE_HEAD=$onedrive_head" >> "$GITHUB_ENV"

      - name: Lint final stack
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          skip-cache: true

      - name: Push validated commits and clean up
        run: |
          set -euxo pipefail
          git push --force origin "$RESOLUTION_HEAD":refs/heads/vfs-conflict-resolution
          git push --force origin "$ONEDRIVE_HEAD":refs/heads/onedrive-etag-preconditions
          git push origin --delete tmp-conflict-name-validation
