name: validate conflict stack

on:
  push:
    branches:
      - validate-onedrive-etag-2
  pull_request:
    branches:
      - onedrive-etag-preconditions

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install test dependencies
        run: |
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
          sudo chown root:$USER /etc/fuse.conf
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse-dev rpm pkg-config git-annex git-annex-remote-rclone nfs-common
          sudo rm -f /usr/local/bin/fusermount /usr/local/bin/fusermount3
      - name: Check formatting
        run: |
          test -z "$(gofmt -l \
            fs/fs.go \
            vfs/vfscache/writeback/writeback.go \
            vfs/vfscache/writeback/writeback_test.go \
            vfs/vfscache/item.go \
            vfs/vfscache/item_test.go \
            backend/onedrive/onedrive.go \
            backend/onedrive/onedrive_test.go)"
      - name: Test changed packages
        run: |
          go test ./fs
          go test ./vfs/vfscache/...
          go test ./backend/onedrive/...
      - name: Vet changed packages
        run: go vet ./vfs/vfscache/... ./backend/onedrive/...
      - name: Build rclone
        run: make
      - name: Quick test
        run: make quicktest
